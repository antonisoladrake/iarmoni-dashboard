  /* ----------------------------------------------------------------------
     Seeded RNG (mulberry32) — datos deterministas
  ---------------------------------------------------------------------- */
  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ----------------------------------------------------------------------
     KPI definitions (15 indicadores)
  ---------------------------------------------------------------------- */
  // betterDirection: 'down' = menos es mejor (perdidas, costes); 'up' = más es mejor (cumplimiento)
  const KPI_DEFS = [
    // ÁREA 1
    { id:'k1_1', area:1, name:'Instrumental perdido vs. inventario total', short:'Pérdida de inventario', unit:'%', decimals:2,

    { id:'k1_5', area:1, name:'Tiempo medio de ciclo completo (turnaround)', short:'Turnaround', unit:'h', decimals:2,
      base: 5.4, drift: -0.10, noise: 0.25, betterDirection:'down',
      target:null, standard:null, formula:'Promedio (Hora liberación estéril − Hora recepción sucio)',
      breakdowns:['Distribución por franja horaria','Percentil 90'] },

    // ÁREA 2
    { id:'k2_1', area:2, name:'Ratio de utilización del instrumental enviado', short:'Utilización quirófano', unit:'%', decimals:1,
      base: 68, drift: 0.7, noise: 1.6, betterDirection:'up',
      target:{type:'gte', value:75}, standard:null,

    { id:'k2_2', area:2, name:'Incidencias por instrumental incompleto', short:'Incidencias material', unit:'%', decimals:2,

      base: 1.20, drift: -0.045, noise: 0.10, betterDirection:'down',
      target:{type:'lt', value:0.8}, standard:'Estándar esencial acreditación Cataluña 9c-02-E54',
      formula:'(Incidencias material estéril) / (Total entregas) × 100',

    { id:'k3_2', area:3, name:'Tasa de errores en empaquetado', short:'Errores empaquetado', unit:'%', decimals:2,

    // ÁREA 4
    { id:'k4_1', area:4, name:'Completitud del registro documental', short:'Completitud registro', unit:'%', decimals:2,
      base: 97.5, drift: 0.22, noise: 0.35, betterDirection:'up',
      target:{type:'eq', value:100}, standard:'RD 192/2023 Art. 8.d',
      formula:'% de los 4 registros obligatorios completados sobre el total requerido',
      breakdowns:['Por tipo de registro','Detalle de registros faltantes'],
      subRegisters: [
        { id:'qext', name:'Control químico externo',  desc:'Por cada material esterilizado',  base: 99.1, drift: 0.04, noise: 0.22, scope:'material' },
        { id:'qint', name:'Control químico interno',  desc:'Por cada material esterilizado',  base: 98.3, drift: 0.06, noise: 0.30, scope:'material' },
        { id:'bio',  name:'Control biológico',        desc:'Diario por autoclave',            base: 95.6, drift: 0.20, noise: 0.55, scope:'diario'   },
        { id:'bd',   name:'Bowie-Dick',               desc:'Diario por autoclave',            base: 96.9, drift: 0.14, noise: 0.40, scope:'diario'   },
      ],
    },
    { id:'k4_2', area:4, name:'Pruebas de Bowie-Dick documentadas', short:'Bowie-Dick', unit:'%', decimals:1,
      base: 96.5, drift: 0.3, noise: 0.7, betterDirection:'up',
      target:{type:'eq', value:100}, standard:'UNE-EN 285',
      formula:'(Días con B-D registrada × autoclave) / (Días laborables × Nº autoclaves)',
      breakdowns:['Calendario heatmap por autoclave'] },

    // ÁREA 5
    { id:'k5_1', area:5, name:'Consumo energético del reprocesado', short:'Consumo energético', unit:'kWh', decimals:0,
      base: 44500, drift: -550, noise: 1600, betterDirection:'down',
      target:null, standard:'RD 214/2025',
      formula:'(Ciclos autoclave × kWh) + (Ciclos lavadora × kWh)',
      breakdowns:['Comparativa con ciclos evitables','Coste en €'] },
    { id:'k5_2', area:5, name:'Consumo de agua del reprocesado', short:'Consumo de agua', unit:'L', decimals:0,
      base: 74500, drift: -800, noise: 2400, betterDirection:'down',
      target:null, standard:'RD 214/2025, UNE-EN ISO 15883',
      formula:'Ciclos lavadora × Litros/ciclo',
      breakdowns:['Coste en €'] },
    { id:'k5_3', area:5, name:'Ahorro de papel por digitalización', short:'Papel ahorrado', unit:'docs', decimals:0,
      base: 4500, drift: 480, noise: 350, betterDirection:'up',
      target:null, standard:'Ley 39/2015',
      formula:'Nº registros digitales generados',
      breakdowns:['Coste evitado €','Equivalencia kg papel'] },
    { id:'k5_4', area:5, name:'Reducción de residuos por optimización', short:'Reducción residuos', unit:'%', decimals:1,
      base: -6.0, drift: -1.0, noise: 1.2, betterDirection:'down',
      target:{type:'lt', value:-10}, standard:'Guía SEDE 2023, Cap. 10',
      formula:'(Sets abiertos innecesariamente actual − anterior) / anterior × 100',
      breakdowns:['Nº absoluto sets evitados'] },
    { id:'k5_5', area:5, name:'Huella de carbono del reprocesado', short:'Huella CO₂', unit:'kg CO₂', decimals:0,
      base: 17800, drift: -240, noise: 650, betterDirection:'down',
      target:null, standard:'RD 214/2025 — obligatorio 2026',
      formula:'(kWh × Factor MITECO) + (L agua × Factor agua)',
      breakdowns:['Desglose energía vs. agua'] },
  ];

  /* ----------------------------------------------------------------------
     History generation: 24 meses históricos (para overlay YoY + predicción)
  ---------------------------------------------------------------------- */
  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function fmtMonth(d) { return d.toLocaleDateString('es-ES', { month:'short', year:'2-digit' }); }
  function fmtMonthLong(d) { return d.toLocaleDateString('es-ES', { month:'long', year:'numeric' }); }
  function fmtDateISO(d) { return d.toISOString().slice(0,10); }

  function makeHistory(kpi) {
    const rng = mulberry32(kpi.id.split('').reduce((a,c)=>a + c.charCodeAt(0)*31, 7));
    const months = 24;
    const out = [];
    const start = addMonths(startOfMonth(TODAY), -months);
    let cumulativeDrift = 0;
    for (let i=0; i<months; i++) {
      const date = addMonths(start, i);
      cumulativeDrift = kpi.drift * i;
      // Estacionalidad ligera (verano: menos actividad → variaciones), aleatorio gaussiano-ish
      const season = Math.sin((date.getMonth()/12)*Math.PI*2) * (kpi.noise * 0.4);
      const noise  = (rng()-0.5) * 2 * kpi.noise;
      // Pico aleatorio puntual
      const spike  = rng() < 0.05 ? (rng()-0.5) * kpi.noise * 4 : 0;
      let val = kpi.base + cumulativeDrift + season + noise + spike;
      // Hard floors / ceilings según unidad
      if (kpi.unit === '%') {
        if (kpi.id === 'k5_4') {
          // Es % de variación: puede ser negativo
        } else {
          val = Math.max(0, Math.min(100, val));
        }
      }
      if (['€','kWh','L','docs','kg CO₂','h'].includes(kpi.unit)) val = Math.max(0, val);
      out.push({ date, value: Number(val.toFixed(kpi.decimals)) });
    }
    return out;
  }

  // Sub-historias (para indicadores compuestos como k4_1)
  function makeSubHistories(kpi) {
    if (!kpi.subRegisters) return null;
    const out = {};
    kpi.subRegisters.forEach(sub => {
      const synth = {
        id: kpi.id + '_' + sub.id,
        unit: '%',
        decimals: 2,
        base: sub.base,
        drift: sub.drift,
        noise: sub.noise,
        betterDirection: 'up',
      };
      out[sub.id] = makeHistory(synth);
    });
    return out;
  }

  // Precompute histories once. Para KPIs con sub-registros, la historia agregada
  // es la media de los 4 sub-registros mes a mes (% medio de completitud).
  const KPIS = KPI_DEFS.map(k => {
    if (k.subRegisters) {
      const subHistories = makeSubHistories(k);
      const len = subHistories[k.subRegisters[0].id].length;
      const history = Array.from({ length: len }, (_, i) => {
        const date = subHistories[k.subRegisters[0].id][i].date;
        const mean = k.subRegisters.reduce((acc, s) => acc + subHistories[s.id][i].value, 0) / k.subRegisters.length;
        return { date, value: Number(mean.toFixed(k.decimals)) };
      });
      return { ...k, history, subHistories };
    }
    return { ...k, history: makeHistory(k) };
  });

  /* ----------------------------------------------------------------------
     Period helpers
  ---------------------------------------------------------------------- */
  const PERIODS = [
    { id:'1m',  label:'Último mes',       months: 1 },
    { id:'3m',  label:'Último trimestre', months: 3 },
    { id:'6m',  label:'Último semestre',  months: 6 },
    { id:'12m', label:'Último año',       months: 12 },
  ];

  function sliceHistory(history, months) {
    return history.slice(-months);
  }
  function sumValues(arr) { return arr.reduce((a,b)=>a+b.value, 0); }
  function meanValues(arr) { return arr.length ? sumValues(arr)/arr.length : 0; }

  function periodValue(kpi, monthsBack) {
    const slice = sliceHistory(kpi.history, monthsBack);
    // Para indicadores acumulables (€, L, kWh, kg CO₂, docs) → suma. El resto → media.
    if (['€','kWh','L','docs','kg CO₂'].includes(kpi.unit)) return sumValues(slice);
    return meanValues(slice);
  }

  function variation(kpi, monthsBack) {
    const slice = sliceHistory(kpi.history, monthsBack);
    const prev  = kpi.history.slice(-monthsBack*2, -monthsBack);
    if (!prev.length) return 0;
    const cur  = ['€','kWh','L','docs','kg CO₂'].includes(kpi.unit) ? sumValues(slice) : meanValues(slice);
    const prv  = ['€','kWh','L','docs','kg CO₂'].includes(kpi.unit) ? sumValues(prev)  : meanValues(prev);
    if (prv === 0) return 0;
    return ((cur - prv) / Math.abs(prv)) * 100;
  }

  /* ----------------------------------------------------------------------
     Format helpers
  ---------------------------------------------------------------------- */
  function nf(n, decimals=0) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return n.toLocaleString('es-ES', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function fmtValue(kpi, n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    if (kpi.unit === '€')      return '€ ' + nf(n, 0);
    if (kpi.unit === 'h') {
      const hours = Math.floor(n);
      const mins  = Math.round((n-hours)*60);
      return hours + 'h ' + String(mins).padStart(2,'0') + 'm';
    }
    if (kpi.unit === '%')      return nf(n, kpi.decimals) + ' %';
    if (kpi.unit === 'kWh')    return nf(n, 0) + ' kWh';
    if (kpi.unit === 'L')      return nf(n, 0) + ' L';
    if (kpi.unit === 'docs')   return nf(n, 0) + ' docs';
    if (kpi.unit === 'kg CO₂') return nf(n, 0) + ' kg CO₂';
    return nf(n, kpi.decimals);
  }

  /* ----------------------------------------------------------------------
     Status / color per threshold
  ---------------------------------------------------------------------- */
  function statusFor(kpi, value, thresholds) {
    if (!kpi.target) return 'neutral';
    const t = thresholds[kpi.id] || kpi.target;
    const v = value;
    if (t.type === 'lt') {
      // menor es mejor: ok < value < warn ≤ critical
      const warn = t.value * 1.2;
      if (v < t.value) return 'ok';
      if (v < warn)    return 'warn';
      return 'bad';
    }
    if (t.type === 'gte') {
      const warn = t.value * 0.98;
      if (v >= t.value) return 'ok';
      if (v >= warn)    return 'warn';
      return 'bad';
    }
    if (t.type === 'eq') {
      // 100% / 0%
      if (t.value === 100) {
        if (v >= 99.5) return 'ok';
        if (v >= 97)   return 'warn';
        return 'bad';
      }
      if (t.value === 0) {
        if (v < 0.5) return 'ok';
        if (v < 2)   return 'warn';
        return 'bad';
      }
    }
    return 'neutral';
  }

  const STATUS_COLOR = {
    ok:      { ring:'ring-emerald-200', bg:'bg-emerald-50',   text:'text-emerald-700', dot:'bg-emerald-500',  hex:'#10B981' },
    warn:    { ring:'ring-amber-200',   bg:'bg-amber-50',     text:'text-amber-700',   dot:'bg-amber-500',    hex:'#F59E0B' },
    bad:     { ring:'ring-rose-200',    bg:'bg-rose-50',      text:'text-rose-700',    dot:'bg-rose-500',     hex:'#EF4444' },
    neutral: { ring:'ring-slate-200',   bg:'bg-slate-50',     text:'text-slate-600',   dot:'bg-slate-400',    hex:'#64748B' },
  };

  /* ----------------------------------------------------------------------
     Linear regression (predicción)
  ---------------------------------------------------------------------- */
  function linearRegression(points) {
    const n = points.length;
    const sx = points.reduce((a,p)=>a+p.x, 0);
    const sy = points.reduce((a,p)=>a+p.y, 0);
    const sxx= points.reduce((a,p)=>a+p.x*p.x, 0);
    const sxy= points.reduce((a,p)=>a+p.x*p.y, 0);
    const slope = (n*sxy - sx*sy) / (n*sxx - sx*sx);
    const intercept = (sy - slope*sx) / n;
    // RMSE
    const rmse = Math.sqrt(points.reduce((a,p)=>a + Math.pow(p.y - (slope*p.x + intercept), 2), 0) / n);
    return { slope, intercept, rmse };
  }

  function predict(history, horizon) {
    const points = history.map((h,i) => ({ x: i, y: h.value }));
    const { slope, intercept, rmse } = linearRegression(points);
    const future = [];
    const lastDate = history[history.length-1].date;
    for (let i=1; i<=horizon; i++) {
      const x = history.length - 1 + i;
      const yhat = slope*x + intercept;
      future.push({
        date: addMonths(lastDate, i),
        value: Number(yhat.toFixed(2)),
        lower: Number((yhat - 1.96 * rmse).toFixed(2)),
        upper: Number((yhat + 1.96 * rmse).toFixed(2)),
      });
    }
    return future;
  }

  function FotoFijaCard({ kpi, thresholds, onOpen, compact=false }) {
    const { filters } = useContext(FilterCtx);
    const value     = periodValue(kpi, filters.period.months);
    const varPct    = variation(kpi, filters.period.months);
    const status    = statusFor(kpi, value, thresholds);
    const sc        = STATUS_COLOR[status];
    const targetT   = thresholds[kpi.id] || kpi.target;
    const isGood    = kpi.betterDirection === 'down' ? varPct < 0 : varPct > 0;
    const arrow     = varPct > 0 ? '↑' : varPct < 0 ? '↓' : '→';
    const varColor  = Math.abs(varPct) < 0.05 ? 'text-slate-500' : isGood ? 'text-emerald-600' : 'text-rose-600';

    // Progress to target (where applicable)
    let progress = null;
    if (targetT) {
      if (targetT.type === 'lt')  progress = Math.min(100, Math.max(0, (1 - value/(targetT.value*1.5)) * 100));
      if (targetT.type === 'gte') progress = Math.min(100, Math.max(0, value / targetT.value * 100));
      if (targetT.type === 'eq' && targetT.value === 100) progress = value;
    }

    return (
      <Card hover onClick={onOpen}
        className={`p-5 relative overflow-hidden ${compact ? '' : 'min-h-[180px]'}`}>
        <div className={`absolute top-0 left-0 right-0 h-1 ${sc.dot}`} />

            <div className="text-[11px] font-medium uppercase tracking-wide text-slate-400">
              {AREAS.find(a => a.id === kpi.area).short}

            <div className="text-sm font-semibold text-slate-800 mt-0.5 line-clamp-2">{kpi.short}</div>
          </div>
          {kpi.target && <Badge tone={status === 'neutral' ? 'neutral' : status}>{status === 'ok' ? 'En objetivo' : status === 'warn' ? 'Atención' : status === 'bad' ? 'Fuera' : '—'}</Badge>}
          {!kpi.target && <Badge tone="neutral">Sin objetivo</Badge>}
        </div>

        <div className="mt-3 flex items-end gap-3">
          <div className="text-3xl font-bold tracking-tight text-slate-900">{fmtValue(kpi, value)}</div>
          {varPct !== 0 && (
            <div className={`text-xs font-semibold ${varColor} mb-1.5`}>
              {arrow} {Math.abs(varPct).toFixed(1)}%
            </div>
          )}
        </div>

        {progress !== null && (
          <div className="mt-3">
            <div className="flex justify-between text-[11px] text-slate-500 mb-1">
              <span>
                {targetT.type === 'lt' && `Objetivo: < ${fmtValue(kpi, targetT.value)}`}
                {targetT.type === 'gte' && `Objetivo: ≥ ${fmtValue(kpi, targetT.value)}`}
                {targetT.type === 'eq' && `Objetivo: ${fmtValue(kpi, targetT.value)}`}

              <span className="font-medium text-slate-600">{progress.toFixed(0)}%</span>

              <div className="h-full rounded-full transition-all" style={{ width: `${progress}%`, background: sc.hex }} />
            </div>
          </div>
        )}

        {!progress && kpi.unit !== '%' && (
          <div className="mt-3 text-[11px] text-slate-500">vs. periodo anterior</div>
        )}

        {kpi.subRegisters && (
          <div className="mt-3 pt-3 border-t border-slate-100 space-y-1.5">
            {kpi.subRegisters.map(sub => {
              const subSlice = kpi.subHistories[sub.id].slice(-filters.period.months);
              const subVal = subSlice.reduce((a,b)=>a+b.value,0) / subSlice.length;
              const subStatus = subVal >= 99.5 ? 'ok' : subVal >= 97 ? 'warn' : 'bad';

  /* ======================================================================
     KPI CARD — EVOLUCIÓN TEMPORAL
  ====================================================================== */
  // Agrupa series mensuales en trimestres (Q1..Q4). Para unidades acumulables se
  // suman; para el resto se promedia.
  function aggregateQuarterly(history, isCumulative) {
    const out = [];
    for (let i = 0; i < history.length; i += 3) {
      const chunk = history.slice(i, i + 3);
      if (chunk.length === 0) continue;
      const sum = chunk.reduce((a, p) => a + p.value, 0);
      const value = isCumulative ? sum : sum / chunk.length;
      const d = chunk[chunk.length - 1].date;
      const q = Math.floor(d.getMonth() / 3) + 1;
      out.push({ date: d, label: `T${q} '${String(d.getFullYear()).slice(-2)}`, value });
    }
    return out;
  }

  function EvolucionView({ kpi, thresholds }) {
    const [granularity, setGranularity] = useState('monthly');
    const [range, setRange]   = useState(12); // rango en meses
    const [overlay, setOverlay] = useState(false);
    const [refLine, setRefLine] = useState(true);

    const isCumulative = ['€','kWh','L','docs','kg CO₂'].includes(kpi.unit);

    const series = useMemo(() => {
      const sliced = kpi.history.slice(-range);
      const prev   = kpi.history.slice(-range*2, -range);
      if (granularity === 'quarterly') {
        const agg = aggregateQuarterly(sliced, isCumulative);
        const aggPrev = aggregateQuarterly(prev, isCumulative);
        return agg.map((p, i) => ({
          date: p.label,
          actual: Number(p.value.toFixed(kpi.decimals)),
          anterior: overlay && aggPrev[i] ? Number(aggPrev[i].value.toFixed(kpi.decimals)) : null,
        }));
      }
      return sliced.map((p, i) => ({
        date: fmtMonth(p.date),
        actual: p.value,
        anterior: overlay && prev[i] ? prev[i].value : null,
      }));
    }, [kpi.id, range, overlay, granularity, isCumulative]);

    const target = thresholds[kpi.id] || kpi.target;

    return (
      <div className="space-y-4">
        <div className="flex flex-wrap items-center gap-3">
          <Toggle value={granularity} onChange={setGranularity}
            options={[{value:'monthly',label:'Mensual'},{value:'quarterly',label:'Trimestral'}]} />

            {[3,6,12,24].map(m => (
              <button key={m} onClick={() => setRange(m)}

                {m}m
              </button>
            ))}
          </div>
          <div className="ml-auto flex items-center gap-3 text-xs text-slate-600">
            {target && (
              <label className="inline-flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={refLine} onChange={e=>setRefLine(e.target.checked)} className="accent-armoni-600" />

              </label>
            )}
            <label className="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={overlay} onChange={e=>setOverlay(e.target.checked)} className="accent-armoni-600" />
              Comparar con año anterior
            </label>
          </div>
        </div>

        <div className="h-72 w-full">
          <ResponsiveContainer>
            <LineChart data={series} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" />
              <XAxis dataKey="date" tick={{ fontSize: 11 }} stroke="#94A3B8" />
              <YAxis tick={{ fontSize: 11 }} stroke="#94A3B8" tickFormatter={(v) => kpi.unit === '€' ? '€'+nf(v,0) : nf(v, kpi.decimals)} />

  /* ======================================================================
     KPI CARD — PREDICCIÓN
  ====================================================================== */
  function PrediccionView({ kpi, thresholds }) {
    const [horizon, setHorizon] = useState(6);
    const target = thresholds[kpi.id] || kpi.target;
    const future = useMemo(() => predict(kpi.history, horizon), [kpi.id, horizon]);
    const data = useMemo(() => {
      const past = kpi.history.map(p => ({ date: fmtMonth(p.date), historico: p.value, prediccion: null, lower:null, upper:null }));
      // Insert a bridging point so historic + prediction line up
      if (past.length) past[past.length-1].prediccion = past[past.length-1].historico;
      const fut = future.map(p => ({ date: fmtMonth(p.date), historico: null, prediccion: p.value, lower: p.lower, upper: p.upper }));
      return past.concat(fut);
    }, [kpi.id, horizon]);

    return (
      <div className="space-y-4">
        <div className="flex flex-wrap items-center gap-3">
          <span className="text-xs font-medium text-slate-500">Horizonte de predicción</span>
          <Toggle value={horizon} onChange={setHorizon}
            options={[{value:3,label:'3 meses'},{value:6,label:'6 meses'},{value:12,label:'12 meses'}]} />
          <Badge tone="armoni" className="ml-auto">
            <svg className="w-3 h-3" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" strokeWidth="1.5"/><path d="M10 6v5l3 2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            Regresión lineal · estimación estadística
          </Badge>
        </div>

        <div className="h-72 w-full">
          <ResponsiveContainer>
            <ComposedChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" />
              <XAxis dataKey="date" tick={{ fontSize: 11 }} stroke="#94A3B8" />
              <YAxis tick={{ fontSize: 11 }} stroke="#94A3B8" tickFormatter={(v) => kpi.unit === '€' ? '€'+nf(v,0) : nf(v, kpi.decimals)} />
              <Tooltip formatter={(v) => v === null ? null : fmtValue(kpi, v)} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Area type="monotone" dataKey="upper" stackId="1" stroke="none" fill="#7C3AED" fillOpacity={0.06} name="Banda superior" legendType="none" />
              <Area type="monotone" dataKey="lower" stackId="2" stroke="none" fill="#7C3AED" fillOpacity={0} name="Banda inferior" legendType="none" />
              <Line type="monotone" dataKey="historico" name="Histórico" stroke="#7C3AED" strokeWidth={2.5} dot={{ r:3 }} />
              <Line type="monotone" dataKey="prediccion" name="Predicción" stroke="#7C3AED" strokeWidth={2.5} strokeDasharray="5 4" dot={{ r:3, fill:'#fff', stroke:'#7C3AED', strokeWidth:1.5 }} />
              {target && <ReferenceLine y={target.value} stroke="#F59E0B" strokeDasharray="6 4" label={{ value:`Objetivo ${fmtValue(kpi, target.value)}`, position:'right', fill:'#F59E0B', fontSize:11 }} />}
            </ComposedChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-slate-50 rounded-xl p-3 text-xs text-slate-600 flex items-start gap-2">
          <svg className="w-4 h-4 mt-0.5 text-amber-500 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm-1 11h2v2H9v-2zm0-7h2v6H9V6z"/></svg>
          <span>
            La proyección se calcula mediante regresión lineal sobre los datos acumulados. La banda sombreada representa el intervalo de confianza al 95%. Es una estimación estadística, no una certeza.
          </span>
        </div>
      </div>
    );
  }

  /* ======================================================================
     BOWIE-DICK heatmap (custom SVG)
  ====================================================================== */
  function DailyAutoclaveHeatmap({ title, subtitle, seedOffset = 0, missRate = 0.03 }) {
    const autoclaves = ESTERILIZADORES.slice(0, 6);
    const today = TODAY;
    const days = 60;
    const start = new Date(today.getTime() - days*24*3600*1000);

    return (
      <Card className="p-5">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div>
            <div className="text-sm font-semibold text-slate-800">{title}</div>
            <div className="text-xs text-slate-500">{subtitle}</div>
          </div>
          <div className="flex items-center gap-3 text-xs text-slate-600">
            <div className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-emerald-400" /> Realizado</div>
            <div className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-rose-400" /> Sin registro</div>
            <div className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-slate-200" /> No laborable</div>
          </div>
        </div>
        <div className="overflow-x-auto scroll-fade">
          <div className="inline-block">
            {autoclaves.map((ac, ri) => (
              <div key={ac} className="flex items-center gap-2 mb-1">
                <div className="w-24 text-xs text-slate-600 shrink-0">{ac}</div>
                <div className="flex gap-0.5">
                  {Array.from({length: days}).map((_, di) => {
                    const d = new Date(start.getTime() + di*24*3600*1000);
                    const dow = d.getDay();
                    const isWeekend = dow === 0 || dow === 6;
                    const seed = mulberry32(ri*31 + di + seedOffset);
                    const r = seed();
                    let color;
                    if (isWeekend) color = '#E2E8F0';
                    else if (r < missRate) color = '#FB7185';
                    else color = '#34D399';
                    return <div key={di} className="w-3 h-3 rounded-sm" style={{ background: color }} title={fmtDateISO(d)} />;
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      </Card>
    );
  }

  function BowieDickHeatmap() {
    return <DailyAutoclaveHeatmap
      title="Registro Bowie-Dick · últimos 60 días"
      subtitle="Cada celda = un día laborable por autoclave"

  }

  function BiologicalHeatmap() {
    return <DailyAutoclaveHeatmap

            </IconBtn>
            <IconBtn title="Salir">
              <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l-5-5 5-5M5 12h12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </IconBtn>
          </div>
        </div>
      </header>
    );
  }

  /* ======================================================================
     PAGE HEADER (title + actions)
  ====================================================================== */
  function PageHeader({ activeArea, onBack }) {
    return (
      <div className="px-4 md:px-8 pt-6 pb-4 bg-slate-50">
        <div className="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 className="text-2xl font-bold text-slate-900">Dashboard de Calidad</h1>
            <p className="text-sm text-slate-500 mt-1">
              Indicadores en tiempo real sobre todo el ciclo de instrumental: planificación, lavado, esterilización, quirófano y retorno.
            </p>
          </div>
          <div className="flex items-center gap-2">
            <ExportMenu context={{ activeArea }} />
            {activeArea !== 'resumen' && (
              <button onClick={onBack} className="text-sm text-slate-500 hover:text-armoni-700 inline-flex items-center gap-1">
                <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M12 5l-5 5 5 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
                Volver
              </button>
            )}
          </div>
        </div>
      </div>
    );
  }

  /* ======================================================================
     AREA TABS
  ====================================================================== */
  const ICONS = {
    resumen: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/></svg>
    ),
    sterilizer: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" strokeWidth="1.5"/><circle cx="10" cy="10" r="3" stroke="currentColor" strokeWidth="1.5"/><circle cx="10" cy="10" r="1" fill="currentColor"/></svg>
    ),
    or: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M4 16v-2a4 4 0 014-4h4a4 4 0 014 4v2" stroke="currentColor" strokeWidth="1.5"/><circle cx="10" cy="6" r="3" stroke="currentColor" strokeWidth="1.5"/></svg>
    ),
    shield: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5l7-3z" stroke="currentColor" strokeWidth="1.5"/><path d="M7 10l2 2 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
    ),
    doc: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M5 3h7l3 3v11a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" strokeWidth="1.5"/><path d="M12 3v3h3M7 10h6M7 13h6M7 16h4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
    ),
    leaf: (
      <svg className="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M4 16c2-8 8-12 14-12-1 8-5 12-12 12-1 0-2 0-2 0z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M5 16l8-8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
    ),
  };

  function AreaTabs({ active, onChange }) {
    const tabs = [
      { id:'resumen', label:'Resumen',  icon:'resumen', color:'#0F172A' },
      ...AREAS.map(a => ({ id:`area-${a.id}`, label:a.short, icon:a.icon, color:a.color, num:a.id })),
    ];
    return (
      <div className="px-4 md:px-8 bg-white border-b border-slate-200 sticky top-16 z-10">
        <div className="flex items-center gap-1 overflow-x-auto scroll-fade">
          {tabs.map(t => {
            const isActive = active === t.id;
            return (
              <button key={t.id} onClick={() => onChange(t.id)}
                className={`relative inline-flex items-center gap-2 px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors ${isActive ? 'text-armoni-700' : 'text-slate-500 hover:text-slate-800'}`}>
                {t.num && <span className="text-[10px] font-bold text-slate-400">{t.num}</span>}
                <span style={{ color: isActive ? t.color : undefined }}>{ICONS[t.icon]}</span>
                {t.label}
                {isActive && <span className="absolute bottom-0 left-2 right-2 h-0.5 rounded-full" style={{ background: t.color }} />}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  /* ======================================================================
     SUMMARY VIEW
  ====================================================================== */
  function SummaryView({ thresholds, onOpenKpi, onGoToArea }) {
    const { filters } = useContext(FilterCtx);

    // Overall KPI counts
    const counts = useMemo(() => {
      let ok=0, warn=0, bad=0, neutral=0;
      KPIS.forEach(k => {
        const v = periodValue(k, filters.period.months);
        const s = statusFor(k, v, thresholds);
        if (s === 'ok') ok++;
        else if (s === 'warn') warn++;
        else if (s === 'bad') bad++;
        else neutral++;
      });
      return { ok, warn, bad, neutral };
    }, [filters.period.months, thresholds]);

    return (
      <div className="space-y-6">
        {/* Vital signs banner */}
        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
          <SummaryStat icon="check" tone="ok"     label="En objetivo"   value={counts.ok}   total={KPIS.length} />
          <SummaryStat icon="warn"  tone="warn"   label="En atención"   value={counts.warn} total={KPIS.length} />
          <SummaryStat icon="bad"   tone="bad"    label="Fuera"         value={counts.bad}  total={KPIS.length} />
          <SummaryStat icon="info"  tone="neutral" label="Sin objetivo" value={counts.neutral} total={KPIS.length} />
        </div>

        {/* Áreas */}
        {AREAS.map(area => (
          <section key={area.id} className="space-y-3">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: area.color + '20', color: area.color }}>
                {ICONS[area.icon]}
              </div>
              <div className="flex-1">
                <h2 className="text-base font-semibold text-slate-900">
                  <span className="text-slate-400 font-medium mr-2">Área {area.id}</span>
                  {area.name}
                </h2>
                <p className="text-xs text-slate-500">{KPIS.filter(k => k.area === area.id).length} indicadores</p>
              </div>
              <button onClick={() => onGoToArea(`area-${area.id}`)} className="text-xs font-medium text-armoni-700 hover:underline">
                Ver detalle →
              </button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {KPIS.filter(k => k.area === area.id).map(kpi => (
                <FotoFijaCard key={kpi.id} kpi={kpi} thresholds={thresholds} onOpen={() => onOpenKpi(kpi.id)} />
              ))}
            </div>
          </section>
        ))}
      </div>
    );
  }

  function SummaryStat({ icon, tone, label, value, total }) {
    const map = {
      ok:      { bg:'bg-emerald-50',  ring:'ring-emerald-200', dot:'text-emerald-600', bar:'bg-emerald-400' },
      warn:    { bg:'bg-amber-50',    ring:'ring-amber-200',   dot:'text-amber-600',   bar:'bg-amber-400' },
      bad:     { bg:'bg-rose-50',     ring:'ring-rose-200',    dot:'text-rose-600',    bar:'bg-rose-400' },
      neutral: { bg:'bg-slate-50',    ring:'ring-slate-200',   dot:'text-slate-500',   bar:'bg-slate-300' },
    };
    const m = map[tone];
    const pct = total ? (value/total)*100 : 0;
    const iconSvg = {
      check: <path d="M5 10l3 3 7-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
      warn:  <path d="M10 2l8 14H2L10 2zM10 8v4M10 14v.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>,
      bad:   <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>,
      info:  <path d="M10 13V9M10 7v.5M10 18a8 8 0 100-16 8 8 0 000 16z" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>,
    };
    return (
      <Card className={`p-4 ring-1 ${m.ring}`}>
        <div className="flex items-start gap-3">
          <div className={`w-10 h-10 rounded-xl ${m.bg} grid place-items-center ${m.dot}`}>
            <svg className="w-5 h-5" viewBox="0 0 20 20" fill="none">{iconSvg[icon]}</svg>
          </div>
          <div className="flex-1 min-w-0">
            <div className="text-xs text-slate-500">{label}</div>
            <div className="text-2xl font-bold text-slate-900 mt-0.5">{value}<span className="text-sm text-slate-400 font-medium"> / {total}</span></div>
            <div className="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div className={`h-full ${m.bar}`} style={{ width: `${pct}%` }} />
            </div>
          </div>
        </div>
      </Card>
    );
  }

  /* ======================================================================
     AREA VIEW (single area, with mode selector + larger detail)
  ====================================================================== */
  function AreaView({ area, thresholds, onOpenKpi }) {
    const { filters } = useContext(FilterCtx);
    const [mode, setMode] = useState('foto');
    const kpis = KPIS.filter(k => k.area === area.id);

    return (
      <div className="space-y-6">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-2xl grid place-items-center" style={{ background: area.color + '20', color: area.color }}>
            {ICONS[area.icon]}
          </div>
          <div className="flex-1">
            <div className="text-xs text-slate-400 font-medium">ÁREA {area.id}</div>
            <h2 className="text-xl font-bold text-slate-900">{area.name}</h2>
          </div>
          <div className="inline-flex rounded-full border border-slate-200 bg-white p-1">
            {[
              { v:'foto', l:'Foto fija' },
              { v:'evolucion', l:'Evolución' },
              { v:'prediccion', l:'Predicción' },
            ].map(o => (
              <button key={o.v} onClick={() => setMode(o.v)}
                className={`px-4 h-8 text-xs font-semibold rounded-full transition-all ${mode === o.v ? 'bg-armoni-600 text-white shadow-sm' : 'text-slate-600 hover:bg-armoni-50'}`}>
                {o.l}
              </button>
            ))}
          </div>
        </div>

        {mode === 'foto' && (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {kpis.map(k => <FotoFijaCard key={k.id} kpi={k} thresholds={thresholds} onOpen={() => onOpenKpi(k.id)} />)}
          </div>
        )}

        {mode === 'evolucion' && (
          <div className="space-y-4">
            {kpis.map(k => (
              <Card key={k.id} className="p-5">
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <div className="text-xs text-slate-500 font-medium uppercase tracking-wide">{k.short}</div>
                    <div className="text-base font-semibold text-slate-900 mt-0.5">{k.name}</div>
                  </div>
                  <button onClick={() => onOpenKpi(k.id)} className="text-xs text-armoni-700 hover:underline">Ver detalle completo →</button>
                </div>
                <EvolucionView kpi={k} thresholds={thresholds} />
              </Card>
            ))}
          </div>
        )}

        {mode === 'prediccion' && (
          <div className="space-y-4">
            {kpis.map(k => (
              <Card key={k.id} className="p-5">
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <div className="text-xs text-slate-500 font-medium uppercase tracking-wide">{k.short}</div>
                    <div className="text-base font-semibold text-slate-900 mt-0.5">{k.name}</div>
                  </div>
                  <button onClick={() => onOpenKpi(k.id)} className="text-xs text-armoni-700 hover:underline">Ver detalle completo →</button>
                </div>
                <PrediccionView kpi={k} thresholds={thresholds} />
              </Card>
            ))}
          </div>
        )}

        {area.id === 4 && (
          <div className="space-y-4">
            <BiologicalHeatmap />
            <BowieDickHeatmap />
          </div>
        )}
      </div>
    );
  }

  /* ======================================================================
     APP ROOT
  ====================================================================== */
  function App() {
    const [filters, dispatch] = useReducer(filterReducer, defaultFilters);
    const [activeTab, setActiveTab] = useState('resumen');
    const [openKpi, setOpenKpi]     = useState(null);
    const [thresholds, setThresholds] = useState({}); // kpiId -> { type, value }

    function setThreshold(kpiId, t) {
      setThresholds(prev => ({ ...prev, [kpiId]: t }));
    }

    const activeArea = activeTab.startsWith('area-')
      ? AREAS.find(a => a.id === parseInt(activeTab.split('-')[1]))
      : null;

    return (
      <FilterCtx.Provider value={{ filters, dispatch }}>
        <div className="min-h-screen bg-slate-50">
          <TopBar />
          <PageHeader activeArea={activeTab} onBack={() => setActiveTab('resumen')} />
          <AreaTabs active={activeTab} onChange={setActiveTab} />

          <div className="px-4 md:px-8 py-6 space-y-5">
            <FilterBar />
            {activeTab === 'resumen'
              ? <SummaryView thresholds={thresholds} onOpenKpi={setOpenKpi} onGoToArea={setActiveTab} />
              : activeArea
                ? <AreaView area={activeArea} thresholds={thresholds} onOpenKpi={setOpenKpi} />
                : null}
          </div>

          <footer className="px-4 md:px-8 py-6 text-xs text-slate-400 flex items-center justify-between border-t border-slate-200 mt-8 bg-white">
            <div className="flex items-center gap-2">
              <MiniLogo />
              <span>· Armoni · Plataforma de trazabilidad quirúrgica</span>
            </div>
            <div>Datos demostrativos · Hospital de Terrassa · {fmtMonthLong(TODAY)}</div>
          </footer>

          {openKpi && (
            <KpiDetail
              kpi={KPIS.find(k => k.id === openKpi)}
              thresholds={thresholds}
              setThreshold={setThreshold}
              onClose={() => setOpenKpi(null)}
            />
          )}
        </div>
      </FilterCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
